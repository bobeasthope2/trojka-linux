# Upstream source definition for the Trojka package.
#
# Everything needed to pull in the original code lives here: where to get it,
# and what it must hash to.  The patches applied on top are listed separately
# in debian/patches/series.
#
# The checksum and the master site are the same ones the FreeBSD ports tree
# records for games/trojka, so a download can be cross-checked against
# https://raw.githubusercontent.com/freebsd/freebsd-ports/main/games/trojka/distinfo

DISTFILE=trojka.tar.gz

# Upstream version.  Maarten Los never numbered the Unix release; 1.0 is the
# number FreeBSD assigns to the distfile of 20 October 1995.
UPSTREAM_VERSION=1.0

SHA256=9bae731883077c1c833a278dd74180f89b9f374c36050ce9de19228f35ac5025
SIZE=10368

# Mirrors, tried in order.  The funet.fi entry is upstream's own master site;
# distcache is FreeBSD's mirror of it.  Integrity comes from SHA256 above, so
# a plain-HTTP fallback is acceptable here.
MIRRORS="
https://www.nic.funet.fi/pub/unix/games/trojka.tar.gz
http://distcache.freebsd.org/ports-distfiles/trojka.tar.gz
ftp://ftp.funet.fi/pub/unix/games/trojka.tar.gz
"
